<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; img-src data:; style-src 'unsafe-inline'; script-src 'self' 'unsafe-inline'">
<title>Share your screen</title>
<style>
  :root { color-scheme: dark; }
  body { margin: 0; font: 14px system-ui, 'Segoe UI', sans-serif; background: #0a0e17; color: #e2e8f0; }
  header { padding: 16px 20px 8px; }
  h1 { margin: 0; font-size: 16px; }
  p { margin: 4px 0 0; color: #94a3b8; font-size: 12px; }
  h2 { margin: 14px 20px 6px; font-size: 11px; letter-spacing: .08em; text-transform: uppercase; color: #94a3b8; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 12px; padding: 0 20px; }
  button.src { all: unset; cursor: pointer; border: 1px solid #334155; border-radius: 10px; overflow: hidden; background: #111827; }
  button.src:hover, button.src:focus-visible { border-color: #d4af37; box-shadow: 0 0 0 1px #d4af37; }
  button.src img { display: block; width: 100%; aspect-ratio: 16/9; object-fit: contain; background: #000; }
  button.src span { display: block; padding: 6px 8px; font-size: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  footer { position: sticky; bottom: 0; display: flex; justify-content: flex-end; padding: 12px 20px; background: #0a0e17; border-top: 1px solid #1e293b; margin-top: 16px; }
  footer button { border: 0; border-radius: 8px; padding: 8px 16px; background: #1e293b; color: #e2e8f0; cursor: pointer; }
</style>
</head>
<body>
<header>
  <h1>Share your screen</h1>
  <p>Choose a whole screen or one window. Everyone in the meeting will see it.</p>
</header>
<h2>Screens</h2><div class="grid" id="screen"></div>
<h2>Windows</h2><div class="grid" id="window"></div>
<footer><button id="cancel">Cancel</button></footer>
<script>
  document.getElementById('cancel').onclick = () => window.close();
  document.addEventListener('keydown', (e) => { if (e.key === 'Escape') window.close(); });
  window.felexPicker.sources().then((list) => {
    for (const s of list) {
      const b = document.createElement('button');
      b.className = 'src';
      const img = document.createElement('img');
      img.src = s.thumb;
      img.alt = '';
      const label = document.createElement('span');
      label.textContent = s.name;
      b.append(img, label);
      b.onclick = () => window.felexPicker.choose(s.id);
      document.getElementById(s.kind).append(b);
    }
  });
</script>
</body>
</html>
