# Push a tag like v1.0.1 and GitHub builds the Windows installer and publishes it as a
# release (free on public repositories). Installed apps pick it up automatically.
name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write   # create the release and upload the installer

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Version in package.json must match the tag
        shell: bash
        run: |
          v=$(node -p "require('./package.json').version")
          [ "v$v" = "$GITHUB_REF_NAME" ] || { echo "package.json is $v but the tag is $GITHUB_REF_NAME"; exit 1; }
      - run: npm ci
      - name: Build and publish
        run: npx electron-builder --win --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
